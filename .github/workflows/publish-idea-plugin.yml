name: Publish IDEA Plugin

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的插件版本号（如 0.1.5）；留空则从 idea-x.y.z 形式的 tag 推导'
        required: false

permissions:
  contents: read

jobs:
  publish-idea:
    # release 仅在 tag 以 idea- 开头时触发；workflow_dispatch 可随时手动运行
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/idea-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#idea-}"
          fi
          if [ -z "$VER" ]; then
            echo "::error::无法确定版本号：release 请使用 idea-x.y.z 形式的 tag，或手动运行时填写 version 输入"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish to JetBrains Marketplace
        working-directory: idea-plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: gradle publishPlugin --no-daemon --console=plain -PpluginVersion=${{ steps.version.outputs.version }}
